syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Public body contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message ManipulatorV1Contract {
  option (island.eos.v1.json_schema_path) = "body/manipulator.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.perception.body.manipulator.v1\",\n"
  "  \"title\": \"ManipulatorDevice\",\n"
  "  \"description\": \"Northbound discovery, configuration, and operational status for a manipulator. EOS may use joint and Cartesian hardware state internally when producing world resources.\",\n"
  "  \"type\": \"object\",\n"
  "  \"properties\": {\n"
  "    \"device_class\": {\n"
  "      \"const\": \"manipulator\"\n"
  "    },\n"
  "    \"configuration\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"joint_names\": {\n"
  "          \"type\": \"array\",\n"
  "          \"items\": {\n"
  "            \"type\": \"string\",\n"
  "            \"minLength\": 1\n"
  "          },\n"
  "          \"minItems\": 1,\n"
  "          \"uniqueItems\": true\n"
  "        },\n"
  "        \"joint_count\": {\n"
  "          \"type\": \"integer\",\n"
  "          \"minimum\": 1\n"
  "        },\n"
  "        \"end_effector_type\": {\n"
  "          \"type\": [\n"
  "            \"string\",\n"
  "            \"null\"\n"
  "          ]\n"
  "        },\n"
  "        \"mount_frame\": {\n"
  "          \"type\": \"string\",\n"
  "          \"minLength\": 1\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"joint_names\",\n"
  "        \"joint_count\",\n"
  "        \"end_effector_type\",\n"
  "        \"mount_frame\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"operational_state\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"controller_state\": {\n"
  "          \"enum\": [\n"
  "            \"disabled\",\n"
  "            \"idle\",\n"
  "            \"active\",\n"
  "            \"fault\"\n"
  "          ]\n"
  "        },\n"
  "        \"calibrated\": {\n"
  "          \"type\": \"boolean\"\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"controller_state\",\n"
  "        \"calibrated\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    }\n"
  "  },\n"
  "  \"required\": [\n"
  "    \"device_class\",\n"
  "    \"configuration\",\n"
  "    \"operational_state\"\n"
  "  ],\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string device_class = 1 [json_name = "device_class"];
  google.protobuf.Struct configuration = 2 [json_name = "configuration"];
  google.protobuf.Struct operational_state = 3 [json_name = "operational_state"];
}
