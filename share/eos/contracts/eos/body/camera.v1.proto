syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Public body contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message CameraV1Contract {
  option (island.eos.v1.json_schema_path) = "body/camera.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.perception.body.camera.v1\",\n"
  "  \"title\": \"CameraDevice\",\n"
  "  \"description\": \"Northbound discovery, configuration, and operational status for a camera. Raw frames remain inside EOS and derived vision products belong to world resources.\",\n"
  "  \"type\": \"object\",\n"
  "  \"properties\": {\n"
  "    \"device_class\": {\n"
  "      \"const\": \"camera\"\n"
  "    },\n"
  "    \"configuration\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"width_px\": {\n"
  "          \"type\": \"integer\",\n"
  "          \"minimum\": 1\n"
  "        },\n"
  "        \"height_px\": {\n"
  "          \"type\": \"integer\",\n"
  "          \"minimum\": 1\n"
  "        },\n"
  "        \"frame_rate_hz\": {\n"
  "          \"type\": \"number\",\n"
  "          \"exclusiveMinimum\": 0\n"
  "        },\n"
  "        \"pixel_format\": {\n"
  "          \"type\": \"string\",\n"
  "          \"minLength\": 1\n"
  "        },\n"
  "        \"fov_rad\": {\n"
  "          \"type\": [\n"
  "            \"number\",\n"
  "            \"null\"\n"
  "          ],\n"
  "          \"exclusiveMinimum\": 0,\n"
  "          \"maximum\": 6.283185307179586\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"width_px\",\n"
  "        \"height_px\",\n"
  "        \"frame_rate_hz\",\n"
  "        \"pixel_format\",\n"
  "        \"fov_rad\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"operational_state\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"present\": {\n"
  "          \"type\": \"boolean\"\n"
  "        },\n"
  "        \"capturing\": {\n"
  "          \"type\": \"boolean\"\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"present\",\n"
  "        \"capturing\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    }\n"
  "  },\n"
  "  \"required\": [\n"
  "    \"device_class\",\n"
  "    \"configuration\",\n"
  "    \"operational_state\"\n"
  "  ],\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string device_class = 1 [json_name = "device_class"];
  google.protobuf.Struct configuration = 2 [json_name = "configuration"];
  google.protobuf.Struct operational_state = 3 [json_name = "operational_state"];
}
