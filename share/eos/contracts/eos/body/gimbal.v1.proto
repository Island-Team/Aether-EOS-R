syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Public body contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message GimbalV1Contract {
  option (island.eos.v1.json_schema_path) = "body/gimbal.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.perception.body.gimbal.v1\",\n"
  "  \"title\": \"GimbalDevice\",\n"
  "  \"description\": \"Northbound discovery, configuration, and operational status for a gimbal. EOS may use measured orientation internally when producing world resources.\",\n"
  "  \"type\": \"object\",\n"
  "  \"properties\": {\n"
  "    \"device_class\": {\n"
  "      \"const\": \"gimbal\"\n"
  "    },\n"
  "    \"configuration\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"pan_min_rad\": {\n"
  "          \"type\": \"number\"\n"
  "        },\n"
  "        \"pan_max_rad\": {\n"
  "          \"type\": \"number\"\n"
  "        },\n"
  "        \"tilt_min_rad\": {\n"
  "          \"type\": \"number\"\n"
  "        },\n"
  "        \"tilt_max_rad\": {\n"
  "          \"type\": \"number\"\n"
  "        },\n"
  "        \"fov_rad\": {\n"
  "          \"type\": \"number\",\n"
  "          \"exclusiveMinimum\": 0,\n"
  "          \"maximum\": 6.283185307179586\n"
  "        },\n"
  "        \"range_m\": {\n"
  "          \"type\": [\n"
  "            \"number\",\n"
  "            \"null\"\n"
  "          ],\n"
  "          \"exclusiveMinimum\": 0\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"pan_min_rad\",\n"
  "        \"pan_max_rad\",\n"
  "        \"tilt_min_rad\",\n"
  "        \"tilt_max_rad\",\n"
  "        \"fov_rad\",\n"
  "        \"range_m\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"operational_state\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"enabled\": {\n"
  "          \"type\": \"boolean\"\n"
  "        },\n"
  "        \"controller_state\": {\n"
  "          \"enum\": [\n"
  "            \"disabled\",\n"
  "            \"idle\",\n"
  "            \"active\",\n"
  "            \"fault\"\n"
  "          ]\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"enabled\",\n"
  "        \"controller_state\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    }\n"
  "  },\n"
  "  \"required\": [\n"
  "    \"device_class\",\n"
  "    \"configuration\",\n"
  "    \"operational_state\"\n"
  "  ],\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string device_class = 1 [json_name = "device_class"];
  google.protobuf.Struct configuration = 2 [json_name = "configuration"];
  google.protobuf.Struct operational_state = 3 [json_name = "operational_state"];
}
