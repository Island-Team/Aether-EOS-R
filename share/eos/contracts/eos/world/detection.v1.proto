syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Public world contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message DetectionV1Contract {
  option (island.eos.v1.json_schema_path) = "world/detection.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.perception.world.detection.v1\",\n"
  "  \"title\": \"DetectionSnapshot\",\n"
  "  \"description\": \"Compact semantic detections with typed human and object identities.\",\n"
  "  \"type\": \"object\",\n"
  "  \"$defs\": {\n"
  "    \"ModelState\": {\n"
  "      \"description\": \"Independent progress and source provenance for one asynchronous model stage.\",\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"status\": {\"type\": \"string\", \"enum\": [\"not_configured\", \"pending\", \"complete\", \"unavailable\"]},\n"
  "        \"sequence\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "        \"source_generation\": {\"description\": \"Generation that produced the retained completed value, or zero before first completion.\", \"type\": \"integer\", \"minimum\": 0},\n"
  "        \"requested_generation\": {\"description\": \"Newest generation requested from this stage, or zero when it has never been requested.\", \"type\": \"integer\", \"minimum\": 0}\n"
  "      },\n"
  "      \"required\": [\"status\", \"sequence\", \"source_generation\", \"requested_generation\"],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"Detection\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"id\": {\"type\": \"string\", \"pattern\": \"^(?:human|obj):[^\\\\s:]+$\"},\n"
  "        \"kind\": {\"enum\": [\"human\", \"object\"], \"type\": \"string\"},\n"
  "        \"label\": {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 128},\n"
  "        \"class_id\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "        \"source_label\": {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 128},\n"
  "        \"source_class_id\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "        \"confidence\": {\"type\": \"number\", \"minimum\": 0, \"maximum\": 1},\n"
  "        \"bbox\": {\n"
  "          \"description\": \"Detection bounds as left, top, right, and bottom source-image pixels.\",\n"
  "          \"type\": \"array\",\n"
  "          \"items\": {\"type\": \"number\"},\n"
  "          \"minItems\": 4,\n"
  "          \"maxItems\": 4\n"
  "        },\n"
  "        \"polygon\": {\n"
  "          \"description\": \"Optional segmentation outline in source-image pixel coordinates.\",\n"
  "          \"type\": \"array\",\n"
  "          \"items\": {\"type\": \"array\", \"items\": {\"type\": \"number\"}, \"minItems\": 2, \"maxItems\": 2},\n"
  "          \"minItems\": 3\n"
  "        },\n"
  "        \"distance_m\": {\"type\": \"number\", \"minimum\": 0},\n"
  "        \"bearing_rad\": {\"type\": \"number\"},\n"
  "        \"keypoints\": {\n"
  "          \"description\": \"COCO-17 joints in source-image pixel coordinates.\",\n"
  "          \"type\": \"array\",\n"
  "          \"items\": {\"type\": \"array\", \"items\": {\"type\": \"number\"}, \"minItems\": 2, \"maxItems\": 2},\n"
  "          \"minItems\": 17,\n"
  "          \"maxItems\": 17\n"
  "        },\n"
  "        \"keypoint_scores\": {\n"
  "          \"type\": \"array\", \"items\": {\"type\": \"number\", \"minimum\": 0, \"maximum\": 1},\n"
  "          \"minItems\": 17, \"maxItems\": 17\n"
  "        },\n"
  "        \"keypoint_depth_m\": {\n"
  "          \"description\": \"Optional aligned metric depth for each COCO-17 joint; null means confidence or depth was insufficient.\",\n"
  "          \"type\": \"array\", \"items\": {\"type\": [\"number\", \"null\"], \"minimum\": 0},\n"
  "          \"minItems\": 17, \"maxItems\": 17\n"
  "        },\n"
  "        \"attributes\": {\n"
  "          \"type\": \"object\",\n"
  "          \"maxProperties\": 16,\n"
  "          \"properties\": {\n"
  "            \"name\": {\"type\": [\"string\", \"null\"], \"minLength\": 1, \"maxLength\": 256},\n"
  "            \"name_source_generation\": {\"description\": \"Camera generation of the face observation that established the retained identity for this human track.\", \"type\": \"integer\", \"minimum\": 0},\n"
  "            \"name_similarity\": {\"description\": \"Similarity score from the face observation that established the retained identity.\", \"type\": \"number\", \"minimum\": 0, \"maximum\": 1},\n"
  "            \"pose\": {\"type\": \"string\", \"enum\": [\"stand\", \"sit\", \"lie\", \"unknown\"]},\n"
  "            \"pose_confidence\": {\"type\": \"number\", \"minimum\": 0, \"maximum\": 1},\n"
  "            \"action\": {\"type\": \"string\", \"enum\": [\"waving\", \"fallen\", \"rest\", \"unknown\"]},\n"
  "            \"action_confidence\": {\"type\": \"number\", \"minimum\": 0, \"maximum\": 1},\n"
  "            \"activity\": {\"description\": \"Temporary compatibility field: meaningful action, otherwise pose.\", \"type\": \"string\", \"enum\": [\"stand\", \"sit\", \"lie\", \"waving\", \"fallen\", \"rest\", \"unknown\"]}\n"
  "          },\n"
  "          \"additionalProperties\": {\"type\": [\"string\", \"number\", \"boolean\", \"null\"]}\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\"id\", \"kind\", \"label\"],\n"
  "      \"allOf\": [\n"
  "        {\"if\": {\"properties\": {\"kind\": {\"const\": \"human\"}}, \"required\": [\"kind\"]}, \"then\": {\"properties\": {\"id\": {\"pattern\": \"^human:[^\\\\s:]+$\"}}, \"required\": [\"confidence\"]}},\n"
  "        {\"if\": {\"properties\": {\"kind\": {\"const\": \"object\"}}, \"required\": [\"kind\"]}, \"then\": {\"properties\": {\"id\": {\"pattern\": \"^obj:[^\\\\s:]+$\"}}}}\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    }\n"
  "  },\n"
  "  \"properties\": {\n"
  "    \"type\": {\"const\": \"detection.snapshot\"},\n"
  "    \"schema_version\": {\"const\": \"1.0\"},\n"
  "    \"sequence\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "    \"timestamp\": {\"type\": \"string\", \"format\": \"date-time\"},\n"
  "    \"source\": {\"type\": \"string\", \"minLength\": 1},\n"
  "    \"source_sequence\": {\n"
  "      \"description\": \"Captured source-frame sequence. Model completion progress is reported independently under models.\",\n"
  "      \"type\": \"integer\", \"minimum\": 1\n"
  "    },\n"
  "    \"source_generation\": {\n"
  "      \"description\": \"Generation of the source camera sample submitted to this detection pipeline.\",\n"
  "      \"type\": \"integer\", \"minimum\": 0\n"
  "    },\n"
  "    \"source_frame_id\": {\n"
  "      \"description\": \"Camera optical coordinate frame; not a video frame number.\",\n"
  "      \"type\": \"string\", \"minLength\": 1\n"
  "    },\n"
  "    \"source_timestamp_ns\": {\n"
  "      \"description\": \"Optional source camera stamp in nanoseconds, kept in its original clock domain.\",\n"
  "      \"type\": \"integer\", \"minimum\": 0\n"
  "    },\n"
  "    \"source_clock\": {\n"
  "      \"description\": \"Clock domain for source_timestamp_ns; source times are comparable only within one domain and clock ID.\",\n"
  "      \"enum\": [\"unknown\", \"unix\", \"steady_boot\", \"ros\", \"simulation\", \"device\"]\n"
  "    },\n"
  "    \"source_clock_id\": {\n"
  "      \"description\": \"Producer-defined identity for the source clock within its domain.\",\n"
  "      \"type\": \"string\", \"minLength\": 1, \"maxLength\": 128\n"
  "    },\n"
  "    \"depth_available\": {\n"
  "      \"description\": \"An aligned depth PNG accompanied the RGB image sent to the pose model.\",\n"
  "      \"type\": \"boolean\"\n"
  "    },\n"
  "    \"source_gimbal\": {\n"
  "      \"description\": \"Gimbal telemetry sampled and retained with this source camera frame.\",\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"pan_rad\": {\"type\": \"number\"},\n"
  "        \"tilt_rad\": {\"type\": \"number\"},\n"
  "        \"pan_rate_rad_s\": {\"type\": \"number\"},\n"
  "        \"tilt_rate_rad_s\": {\"type\": \"number\"},\n"
  "        \"sampled_monotonic_ns\": {\"type\": \"integer\", \"minimum\": 0}\n"
  "      },\n"
  "      \"required\": [\"pan_rad\", \"tilt_rad\", \"pan_rate_rad_s\", \"tilt_rate_rad_s\"],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"face_recognition_status\": {\n"
  "      \"description\": \"Compatibility summary of the asynchronous face model state.\",\n"
  "      \"enum\": [\"complete\", \"pending\", \"unavailable\", \"not_configured\"]\n"
  "    },\n"
  "    \"models\": {\n"
  "      \"description\": \"Independent asynchronous state for each model stage.\",\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"human\": {\"$ref\": \"#/$defs/ModelState\"},\n"
  "        \"pose\": {\"$ref\": \"#/$defs/ModelState\"},\n"
  "        \"action\": {\"$ref\": \"#/$defs/ModelState\"},\n"
  "        \"face\": {\"$ref\": \"#/$defs/ModelState\"}\n"
  "      },\n"
  "      \"required\": [\"human\", \"pose\", \"action\", \"face\"],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"face_observation\": {\n"
  "      \"description\": \"Source and age at assembly time of the asynchronous face observation projected by track onto this pose snapshot.\",\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"source_generation\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "        \"age_ms\": {\"type\": \"integer\", \"minimum\": 0}\n"
  "      },\n"
  "      \"required\": [\"source_generation\", \"age_ms\"],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"pose_observation\": {\n"
  "      \"description\": \"Provenance and assembly-time age of joints and pose attributes retained by track.\",\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"source_generation\": {\"type\": \"integer\", \"minimum\": 1},\n"
  "        \"source_timestamp_ns\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "        \"source_clock\": {\"enum\": [\"unknown\", \"unix\", \"steady_boot\", \"ros\", \"simulation\", \"device\"]},\n"
  "        \"source_clock_id\": {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 128},\n"
  "        \"age_ms\": {\"type\": \"integer\", \"minimum\": 0}\n"
  "      },\n"
  "      \"required\": [\"source_generation\", \"age_ms\"],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"image_width_px\": {\"type\": \"integer\", \"minimum\": 1},\n"
  "    \"image_height_px\": {\"type\": \"integer\", \"minimum\": 1},\n"
  "    \"detections\": {\"type\": \"array\", \"items\": {\"$ref\": \"#/$defs/Detection\"}}\n"
  "  },\n"
  "  \"required\": [\"type\", \"schema_version\", \"sequence\", \"timestamp\", \"source\", \"detections\"],\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string type = 1 [json_name = "type"];
  string schema_version = 2 [json_name = "schema_version"];
  int64 sequence = 3 [json_name = "sequence"];
  string timestamp = 4 [json_name = "timestamp"];
  string source = 5 [json_name = "source"];
  optional int64 source_sequence = 6 [json_name = "source_sequence"];
  optional int64 source_generation = 7 [json_name = "source_generation"];
  optional string source_frame_id = 8 [json_name = "source_frame_id"];
  optional int64 source_timestamp_ns = 9 [json_name = "source_timestamp_ns"];
  optional string source_clock = 10 [json_name = "source_clock"];
  optional string source_clock_id = 11 [json_name = "source_clock_id"];
  optional bool depth_available = 12 [json_name = "depth_available"];
  google.protobuf.Struct source_gimbal = 13 [json_name = "source_gimbal"];
  optional string face_recognition_status = 14 [json_name = "face_recognition_status"];
  google.protobuf.Struct models = 15 [json_name = "models"];
  google.protobuf.Struct face_observation = 16 [json_name = "face_observation"];
  google.protobuf.Struct pose_observation = 17 [json_name = "pose_observation"];
  optional int64 image_width_px = 18 [json_name = "image_width_px"];
  optional int64 image_height_px = 19 [json_name = "image_height_px"];
  repeated google.protobuf.Value detections = 20 [json_name = "detections"];
}
