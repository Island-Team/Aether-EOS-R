syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Read-only, freshness-qualified obstacle observations in the robot body frame.
message BaseObstaclesV1Contract {
  option (island.eos.v1.json_schema_path) = "world/base_obstacles.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.perception.world.base-obstacles.v1\",\n"
  "  \"title\": \"BaseObstacles\",\n"
  "  \"description\": \"Eight directional obstacle observations; absent distance never implies clearance.\",\n"
  "  \"type\": \"object\",\n"
  "  \"properties\": {\n"
  "    \"type\": {\"const\": \"base.obstacles\"},\n"
  "    \"schema_version\": {\"const\": \"1.0\"},\n"
  "    \"sequence\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "    \"timestamp\": {\"type\": \"string\", \"format\": \"date-time\"},\n"
  "    \"frame_id\": {\"const\": \"body\"},\n"
  "    \"part_id\": {\"type\": \"string\", \"minLength\": 1},\n"
  "    \"description\": {\"type\": [\"string\", \"null\"]},\n"
  "    \"tags\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}, \"uniqueItems\": true},\n"
  "    \"state\": {\"enum\": [\"unavailable\", \"fresh\", \"stale\", \"source_error\", \"transport_error\"]},\n"
  "    \"age_s\": {\"type\": \"number\", \"minimum\": 0},\n"
  "    \"source_stamp_s\": {\"type\": \"number\", \"minimum\": 0},\n"
  "    \"sectors\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"front\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"front_left\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"left\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"rear_left\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"rear\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"rear_right\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"right\": {\"$ref\": \"#/$defs/sector\"},\n"
  "        \"front_right\": {\"$ref\": \"#/$defs/sector\"}\n"
  "      },\n"
  "      \"required\": [\"front\", \"front_left\", \"left\", \"rear_left\", \"rear\", \"rear_right\", \"right\", \"front_right\"],\n"
  "      \"additionalProperties\": false\n"
  "    }\n"
  "  },\n"
  "  \"$defs\": {\n"
  "    \"sector\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"point_count\": {\"type\": \"integer\", \"minimum\": 0},\n"
  "        \"distance_m\": {\"type\": \"number\", \"minimum\": 0}\n"
  "      },\n"
  "      \"required\": [\"point_count\"],\n"
  "      \"if\": {\"properties\": {\"point_count\": {\"const\": 0}}},\n"
  "      \"then\": {\"not\": {\"required\": [\"distance_m\"]}},\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"unknown_sector\": {\"allOf\": [{\"$ref\": \"#/$defs/sector\"}, {\"properties\": {\"point_count\": {\"const\": 0}}}]}\n"
  "  },\n"
  "  \"required\": [\"type\", \"schema_version\", \"sequence\", \"timestamp\", \"frame_id\", \"part_id\", \"description\", \"tags\", \"state\", \"sectors\"],\n"
  "  \"if\": {\"properties\": {\"state\": {\"not\": {\"const\": \"fresh\"}}}},\n"
  "  \"then\": {\"properties\": {\"sectors\": {\"patternProperties\": {\".*\": {\"$ref\": \"#/$defs/unknown_sector\"}}}}},\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string type = 1 [json_name = "type"];
  string schema_version = 2 [json_name = "schema_version"];
  int64 sequence = 3 [json_name = "sequence"];
  string timestamp = 4 [json_name = "timestamp"];
  string frame_id = 5 [json_name = "frame_id"];
  string part_id = 6 [json_name = "part_id"];
  string description = 7 [json_name = "description"];
  repeated google.protobuf.Value tags = 8 [json_name = "tags"];
  string state = 9 [json_name = "state"];
  optional double age_s = 10 [json_name = "age_s"];
  optional double source_stamp_s = 11 [json_name = "source_stamp_s"];
  google.protobuf.Struct sectors = 12 [json_name = "sectors"];
}
