syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";

// Public actions contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message GimbalMotionV1Contract {
  option (island.eos.v1.json_schema_path) = "actions/gimbal_motion.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.actions.gimbal_motion.v1\",\n"
  "  \"x-island-primitive-version\": \"1.0.0\",\n"
  "  \"description\": \"Release one absolute or relative pan/tilt target to a gimbal.\",\n"
  "  \"type\": \"object\",\n"
  "  \"properties\": {\n"
  "    \"type\": {\"const\": \"gimbal.motion\", \"default\": \"gimbal.motion\", \"type\": \"string\"},\n"
  "    \"command_id\": {\"type\": [\"string\", \"null\"], \"default\": null},\n"
  "    \"reference\": {\"enum\": [\"relative\", \"absolute\"], \"type\": \"string\"},\n"
  "    \"pan_rad\": {\"type\": \"number\"},\n"
  "    \"tilt_rad\": {\"type\": \"number\"},\n"
  "    \"speed_rad_s\": {\"description\": \"Optional slew speed in radians per second.\", \"type\": \"number\"},\n"
  "    \"stream\": {\"description\": \"Return after publishing instead of waiting for terminal completion.\", \"type\": \"boolean\", \"default\": false}\n"
  "  },\n"
  "  \"required\": [\"reference\", \"pan_rad\", \"tilt_rad\"],\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  optional string type = 1 [json_name = "type"];
  optional string command_id = 2 [json_name = "command_id"];
  string reference = 3 [json_name = "reference"];
  double pan_rad = 4 [json_name = "pan_rad"];
  double tilt_rad = 5 [json_name = "tilt_rad"];
  optional double speed_rad_s = 6 [json_name = "speed_rad_s"];
  optional bool stream = 7 [json_name = "stream"];
}
