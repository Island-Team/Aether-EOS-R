syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Public body contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message SpeakerV1Contract {
  option (island.eos.v1.json_schema_path) = "body/speaker.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.perception.body.speaker.v1\",\n"
  "  \"title\": \"SpeakerDevice\",\n"
  "  \"description\": \"Northbound discovery, configuration, and playback status for a speaker. Generated or queued audio content is not exposed as perception data.\",\n"
  "  \"type\": \"object\",\n"
  "  \"properties\": {\n"
  "    \"device_class\": {\n"
  "      \"const\": \"speaker\"\n"
  "    },\n"
  "    \"configuration\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"supported_media_types\": {\n"
  "          \"type\": \"array\",\n"
  "          \"items\": {\n"
  "            \"type\": \"string\",\n"
  "            \"minLength\": 1\n"
  "          },\n"
  "          \"minItems\": 1,\n"
  "          \"uniqueItems\": true\n"
  "        },\n"
  "        \"sample_rates_hz\": {\n"
  "          \"type\": \"array\",\n"
  "          \"items\": {\n"
  "            \"type\": \"integer\",\n"
  "            \"minimum\": 1\n"
  "          },\n"
  "          \"minItems\": 1,\n"
  "          \"uniqueItems\": true\n"
  "        },\n"
  "        \"channels\": {\n"
  "          \"type\": \"integer\",\n"
  "          \"minimum\": 1\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"supported_media_types\",\n"
  "        \"sample_rates_hz\",\n"
  "        \"channels\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    },\n"
  "    \"operational_state\": {\n"
  "      \"type\": \"object\",\n"
  "      \"properties\": {\n"
  "        \"present\": {\n"
  "          \"type\": \"boolean\"\n"
  "        },\n"
  "        \"playback_state\": {\n"
  "          \"enum\": [\n"
  "            \"idle\",\n"
  "            \"buffering\",\n"
  "            \"playing\",\n"
  "            \"draining\",\n"
  "            \"fault\"\n"
  "          ]\n"
  "        },\n"
  "        \"buffered_duration_ms\": {\n"
  "          \"type\": \"integer\",\n"
  "          \"minimum\": 0\n"
  "        }\n"
  "      },\n"
  "      \"required\": [\n"
  "        \"present\",\n"
  "        \"playback_state\",\n"
  "        \"buffered_duration_ms\"\n"
  "      ],\n"
  "      \"additionalProperties\": false\n"
  "    }\n"
  "  },\n"
  "  \"required\": [\n"
  "    \"device_class\",\n"
  "    \"configuration\",\n"
  "    \"operational_state\"\n"
  "  ],\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string device_class = 1 [json_name = "device_class"];
  google.protobuf.Struct configuration = 2 [json_name = "configuration"];
  google.protobuf.Struct operational_state = 3 [json_name = "operational_state"];
}
