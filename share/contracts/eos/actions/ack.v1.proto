syntax = "proto3";
package island.eos.v1;

import "eos/options/schema.proto";
import "google/protobuf/struct.proto";

// Public actions contract. JSON-specific constraints live in the annotated
// schema until protobuf field options can express them without loss.
message AckV1Contract {
  option (island.eos.v1.json_schema_path) = "actions/ack.v1.json";
  option (island.eos.v1.json_schema) =
  "{\n"
  "  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n"
  "  \"$id\": \"egia.contracts.actions.ack.v1\",\n"
  "  \"$defs\": {\n"
  "    \"RejectReason\": {\n"
  "      \"description\": \"Machine-readable rejection taxonomy for ``PrimitiveAck.reason_code``.\",\n"
  "      \"enum\": [\n"
  "        \"rejected.estop\",\n"
  "        \"rejected.mode\",\n"
  "        \"rejected.posture\",\n"
  "        \"rejected.invalid_state\",\n"
  "        \"rejected.busy\",\n"
  "        \"rejected.unsupported\",\n"
  "        \"rejected.invalid_arguments\",\n"
  "        \"rejected.invalid_target\",\n"
  "        \"rejected.unsupported_reference\",\n"
  "        \"rejected.unavailable_dependency\",\n"
  "        \"rejected.unauthorized\",\n"
  "        \"rejected.internal\"\n"
  "      ],\n"
  "      \"title\": \"RejectReason\",\n"
  "      \"type\": \"string\"\n"
  "    }\n"
  "  },\n"
  "  \"description\": \"Result envelope for one primitive invocation.\",\n"
  "  \"properties\": {\n"
  "    \"type\": {\n"
  "      \"const\": \"primitive.ack\",\n"
  "      \"default\": \"primitive.ack\",\n"
  "      \"title\": \"Type\",\n"
  "      \"type\": \"string\"\n"
  "    },\n"
  "    \"primitive_version\": {\n"
  "      \"description\": \"Exact version of the primitive that produced this acknowledgement.\",\n"
  "      \"pattern\": \"^(0|[1-9][0-9]*)\\\\.(0|[1-9][0-9]*)\\\\.(0|[1-9][0-9]*)$\",\n"
  "      \"title\": \"Primitive Version\",\n"
  "      \"type\": \"string\"\n"
  "    },\n"
  "    \"primitive\": {\n"
  "      \"description\": \"primitive discriminator, e.g. \\\"base.velocity\\\"\",\n"
  "      \"title\": \"Primitive\",\n"
  "      \"type\": \"string\"\n"
  "    },\n"
  "    \"accepted\": {\n"
  "      \"title\": \"Accepted\",\n"
  "      \"type\": \"boolean\"\n"
  "    },\n"
  "    \"reason\": {\n"
  "      \"anyOf\": [\n"
  "        {\n"
  "          \"type\": \"string\"\n"
  "        },\n"
  "        {\n"
  "          \"type\": \"null\"\n"
  "        }\n"
  "      ],\n"
  "      \"default\": null,\n"
  "      \"description\": \"human-readable admission-rejection detail; null for every admitted command, including terminal failure\",\n"
  "      \"title\": \"Reason\"\n"
  "    },\n"
  "    \"reason_code\": {\n"
  "      \"anyOf\": [\n"
  "        {\n"
  "          \"$ref\": \"#/$defs/RejectReason\"\n"
  "        },\n"
  "        {\n"
  "          \"type\": \"null\"\n"
  "        }\n"
  "      ],\n"
  "      \"default\": null,\n"
  "      \"description\": \"machine-readable admission-rejection taxonomy; null for every admitted command, including terminal failure\"\n"
  "    },\n"
  "    \"command_id\": {\n"
  "      \"type\": [\"string\", \"null\"],\n"
  "      \"description\": \"globally unique idempotency and cancellation key; null only for an internal pre-envelope rejection\",\n"
  "      \"title\": \"Command Id\"\n"
  "    },\n"
  "    \"sequence\": {\n"
  "      \"minimum\": 0,\n"
  "      \"title\": \"Sequence\",\n"
  "      \"type\": \"integer\"\n"
  "    },\n"
  "    \"result\": {\n"
  "      \"additionalProperties\": true,\n"
  "      \"type\": \"object\",\n"
  "      \"description\": \"terminal result; status is always present and admitted failure details remain inside this object\",\n"
  "      \"required\": [\"status\"],\n"
  "      \"properties\": {\n"
  "        \"status\": {\n"
  "          \"enum\": [\"succeeded\", \"rejected\", \"failed\", \"cancelled\", \"timed_out\", \"outcome_unknown\"]\n"
  "        }\n"
  "      },\n"
  "      \"title\": \"Result\"\n"
  "    }\n"
  "  },\n"
  "  \"required\": [\n"
  "    \"type\",\n"
  "    \"primitive_version\",\n"
  "    \"primitive\",\n"
  "    \"accepted\",\n"
  "    \"command_id\",\n"
  "    \"sequence\",\n"
  "    \"result\"\n"
  "  ],\n"
  "  \"allOf\": [\n"
  "    {\n"
  "      \"if\": {\"properties\": {\"accepted\": {\"const\": true}}, \"required\": [\"accepted\"]},\n"
  "      \"then\": {\n"
  "        \"properties\": {\"reason\": {\"type\": \"null\"}, \"reason_code\": {\"type\": \"null\"}},\n"
  "        \"required\": [\"reason\", \"reason_code\"]\n"
  "      },\n"
  "      \"else\": {\n"
  "        \"properties\": {\n"
  "          \"reason\": {\"type\": \"string\", \"minLength\": 1},\n"
  "          \"reason_code\": {\"$ref\": \"#/$defs/RejectReason\"}\n"
  "        },\n"
  "        \"required\": [\"reason\", \"reason_code\"]\n"
  "      }\n"
  "    }\n"
  "  ],\n"
  "  \"title\": \"PrimitiveAck\",\n"
  "  \"type\": \"object\",\n"
  "  \"additionalProperties\": false\n"
  "}\n";
  string type = 1 [json_name = "type"];
  string primitive_version = 2 [json_name = "primitive_version"];
  string primitive = 3 [json_name = "primitive"];
  bool accepted = 4 [json_name = "accepted"];
  google.protobuf.Value reason = 5 [json_name = "reason"];
  google.protobuf.Value reason_code = 6 [json_name = "reason_code"];
  string command_id = 7 [json_name = "command_id"];
  int64 sequence = 8 [json_name = "sequence"];
  google.protobuf.Struct result = 9 [json_name = "result"];
}
