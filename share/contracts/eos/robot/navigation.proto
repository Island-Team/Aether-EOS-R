syntax = "proto3";

package island.eos.v1;

message NavigationPoint {
  string name = 1;
  double x_m = 2;
  double y_m = 3;
  double yaw_rad = 4;
}

message ListNavigationPointsRequest {
  string robot_name = 1;
}

message ListNavigationPointsResponse {
  repeated NavigationPoint points = 1;
}

message GetNavigationPointRequest {
  string robot_name = 1;
  string name = 2;
}

message PutNavigationPointRequest {
  string robot_name = 1;
  string name = 2;
  optional double x_m = 3;
  optional double y_m = 4;
  optional double yaw_rad = 5;
}

message ReloadNavigationPointsResponse {
  uint64 point_count = 1;
}
