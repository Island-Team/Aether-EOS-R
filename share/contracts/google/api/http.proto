// Minimal wire-compatible declaration of google.api.HttpRule.
// Field numbers match googleapis/google/api/http.proto so generated options
// interoperate with standard gRPC JSON transcoders.
syntax = "proto3";

package google.api;

message HttpRule {
  string selector = 1;
  oneof pattern {
    string get = 2;
    string put = 3;
    string post = 4;
    string delete = 5;
    string patch = 6;
    CustomHttpPattern custom = 8;
  }
  string body = 7;
  repeated HttpRule additional_bindings = 11;
  string response_body = 12;
}

message CustomHttpPattern {
  string kind = 1;
  string path = 2;
}
