[package]
name = "aether-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-hooks = []

[dependencies]
aether-common = { path = "../aether-common" }
aether-hal = { path = "../aether-hal" }
aether-dispatcher = { path = "../aether-dispatcher" }
aether-mujoco = { path = "../aether-mujoco" }
thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-health = "0.14.9"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
futures-core = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
goblin = "0.10"
libloading = "0.8"
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
semver = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.2"

[dev-dependencies]
aether-dispatcher = { path = "../aether-dispatcher", features = ["test-hooks"] }
