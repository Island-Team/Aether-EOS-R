# Standalone simulator. eosd neither launches nor supervises this process.
[simulator]
host = "127.0.0.1"
port = 16004
# Stable id below <state>/simulator/maps. Empty starts with a white fallback.
map_id = ""
# "scene" uses ray-selected library media and needs no host camera. Select
# "system" to capture the operating system's default camera instead.
camera_source = "scene"

[simulator.camera]
width_px = 1920
height_px = 1080
fps = 30
