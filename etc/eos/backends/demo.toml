tags = ["manipulation"]

[[profile.demo-host.device.primitive]]
name = "gripper.motion"
version = "1.0.0"
description = "Open or close using the backend default when force is omitted."

[profile.demo-host.device.backend]
type = "demo"

[profile.demo-host.device.feeds.proprioception]
max_rate_hz = 10.0

[profile.demo-host.device.feeds.health]
max_rate_hz = 10.0

[[profile.demo-host.device]]
